name: Sync versions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Sync plugin versions and regenerate versions.json
        run: |
          scripts/sync-plugin-versions.sh
          scripts/generate-versions.sh
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json '*/.claude-plugin/plugin.json' '*/.codex-plugin/plugin.json'
          git commit -m "chore: sync plugin versions"
          git pull --rebase
          git push
