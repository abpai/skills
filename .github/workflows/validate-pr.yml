name: Validate PR

on:
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - name: Sync plugin versions and regenerate versions.json
        run: |
          scripts/sync-plugin-versions.sh
          scripts/generate-versions.sh
      - name: Verify generated version surfaces are committed
        run: |
          if ! git diff --exit-code -- \
            versions.json \
            '*/.claude-plugin/plugin.json' \
            '*/.codex-plugin/plugin.json'; then
            echo "::error::Generated version surfaces are out of date. Run scripts/sync-plugin-versions.sh && scripts/generate-versions.sh and commit the result."
            exit 1
          fi
      - name: Run skill validation
        run: scripts/validate-skills.sh

  wrapper-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run wrapper parity tests
        run: scripts/test-wrapper-parity.sh
      - name: Run push-gate tests
        run: scripts/test-gate-before-push.sh

  check-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version bumps for changed plugins
        run: |
          extract_skill_version() {
            awk '
              /^---$/ { fence++; next }
              fence == 1 && /^metadata:/ { in_meta=1; next }
              fence == 1 && in_meta && /^[^ ]/ { in_meta=0 }
              fence == 1 && in_meta && /^  version:/ {
                v = $0
                sub(/^  version:[ ]*/, "", v)
                gsub(/"/, "", v)
                print v
                exit
              }
              fence >= 2 { exit }
            ' "$1"
          }

          extract_manifest_version() {
            # Reads the top-level "version" string from a plugin.json on stdin.
            python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null
          }

          is_disabled_model_invocation() {
            awk '
              /^---$/ { fence++; next }
              fence == 1 && /^disable-model-invocation:[ ]*true[ ]*$/ { found=1 }
              fence >= 2 { exit }
              END { exit found ? 0 : 1 }
            ' "$1"
          }

          base_ref="origin/${{ github.base_ref }}"
          changed_dirs=$(git diff --name-only "$base_ref...HEAD" | cut -d/ -f1 | sort -u)

          failed=0
          checked=0

          for dir in $changed_dirs; do
            # Skip non-plugin directories
            [ -d "$dir/.claude-plugin" ] || continue

            # Check if meaningful files changed
            meaningful_changes=$(git diff --name-only "$base_ref...HEAD" \
              -- "$dir/skills/" "$dir/agents/" "$dir/commands/" "$dir/hooks/" "$dir/internal/" \
                 "$dir/.claude-plugin/plugin.json" "$dir/.codex-plugin/plugin.json")
            [ -n "$meaningful_changes" ] || continue

            # Resolve the version source: a model-invocable/versioned SKILL.md
            # if the plugin has one, otherwise the plugin manifest (command-only
            # plugins like pi, whose slash entries are disabled skill shims).
            skill_md=""
            while IFS= read -r candidate; do
              is_disabled_model_invocation "$candidate" && continue
              [ -n "$(extract_skill_version "$candidate")" ] || continue
              skill_md="$candidate"
              break
            done < <(find "$dir/skills" -name SKILL.md -type f 2>/dev/null | sort)

            if [ -n "$skill_md" ]; then
              version_file="$skill_md"
              current_version=$(extract_skill_version "$skill_md")
              base_blob=$(git show "$base_ref:$skill_md" 2>/dev/null || true)
              base_version=$([ -n "$base_blob" ] && printf '%s\n' "$base_blob" | extract_skill_version /dev/stdin || true)
            else
              version_file="$dir/.claude-plugin/plugin.json"
              [ -f "$version_file" ] || continue
              current_version=$(extract_manifest_version < "$version_file")
              base_blob=$(git show "$base_ref:$version_file" 2>/dev/null || true)
              base_version=$([ -n "$base_blob" ] && printf '%s\n' "$base_blob" | extract_manifest_version || true)
            fi

            checked=$((checked + 1))

            if [ -n "$base_version" ] && [ "$current_version" = "$base_version" ]; then
              echo "::error::$dir: version ($current_version) in $version_file was not bumped"
              failed=1
              continue
            fi

            echo "  [OK] $dir: ${base_version:-new} -> $current_version ($version_file)"
          done

          if [ $failed -ne 0 ]; then
            echo ""
            echo "Fix: bump metadata.version in the model-invocable SKILL.md, or version in .claude-plugin/plugin.json for command-only plugins."
            exit 1
          fi

          echo "Checked $checked plugin(s). All changed plugins have proper version bumps."
