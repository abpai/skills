name: Validate PR

# Every job runs `bin/skills gate <ids> --strict`, so the gate list in
# scripts/lib/gates.ts is the one definition of "validated". --strict turns a
# skipped or unproven gate (missing tool, no network) into a failure here.
# Job names `validate-skills` and `check-version-bump` are required checks in
# the main ruleset; keep them stable.

on:
  # Deliberately unfiltered by base branch. Restricting to `branches: [main]`
  # meant a PR stacked on another branch ran zero checks, which is how #100
  # merged unvalidated. Stacked work is exactly where validation is easiest to
  # skip by accident, so every PR runs the same gate regardless of its base.
  pull_request:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    # Belt-and-suspenders to the per-monitor outer timeout inside the wrapper
    # parity test: cap the job well below GitHub's 6h default so it fails fast.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The runner fixture tests and the python syntax check need python3.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gates surfaces, structure, tooling, runners
        run: bin/skills gate surfaces structure tooling runners --strict --keep-going

  npx-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Gate install (real npx skills installer)
        run: bin/skills gate install --strict

  check-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      # Always measured against main, not the PR's base branch: a stacked PR
      # bumps once, and retargeting it to main never asks for a second bump.
      - name: Gates version, whitespace
        run: bin/skills gate version whitespace --strict --base origin/main
