name: Eve skill evals

# Non-blocking behavioral-contract lane. This runs REAL model sessions against
# packaged SKILL.md dirs via Eve, so it complements — never replaces — the
# structural validate-skills.sh gate and the manual Claude/Codex dogfood.
# It is intentionally NOT a required check: Eve is public preview (pinned in
# evals/eve/package.json) and live evals need a model key.

on:
  pull_request:
    # `labeled` is not in the default set, and the live-evals job keys on the
    # `run-evals` label — without it, labeling a PR does nothing until the next
    # push. Measured on PR #125: the label alone never started a run.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "**/skills/**/SKILL.md"
      - "evals/eve/**"
      - ".github/workflows/eve-evals.yml"
  push:
    branches: [main]
  # Manual trigger for the live lane. Live evals cost real tokens, so they are
  # OFF by default and run only when asked for — see the `live-evals` job.
  workflow_dispatch:
    inputs:
      provider:
        description: "Subject model provider"
        type: choice
        options: [openai, anthropic]
        default: openai
      filter:
        description: "Eval ids to run (space-separated; blank = whole live suite)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Always runs, no secrets: proves the harness boots and grades a turn under
  # the deterministic mock model, and that the live eval files typecheck and
  # discover. This is the gate that catches harness rot on every PR.
  harness-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: evals/eve
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Eve's CLI requires Node.js >=24; setup-bun leaves the runner on Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install (frozen)
        run: bun install --frozen-lockfile
      - name: Materialize skills from canonical sources
        run: bun run prepare-skills
      - name: Typecheck eval files against Eve types
        run: bun run typecheck
      - name: Prove live coverage controls
        run: bun run test:coverage
      - name: Pull pinned outcome verifier image
        run: bun run outcome:pull
      - name: Prove outcome verifier isolation
        run: bun run test:outcome-isolation
      - name: Discover evals
        run: bun run list
      - name: Smoke eval (mock model, no secrets)
        run: bun run eval:smoke

  # Live behavioral evals against a real model. OPT-IN ONLY — these cost real
  # tokens, so they never run just because a PR was opened. Two ways to ask:
  #
  #   1. Actions -> "Eve skill evals" -> Run workflow. Pick the branch, the
  #      provider, and optionally a subset of eval ids. Or from a terminal:
  #        gh workflow run eve-evals.yml --ref <branch> \
  #          -f provider=anthropic -f filter=contracts/harness-d7-safety-cap
  #   2. Add the `run-evals` label to a same-repo PR. Useful once a stack has
  #      been squashed into a single PR and is ready for a real check.
  #
  # `harness-smoke` still runs on every PR: it is free, needs no secrets, and
  # catches harness rot. Only this job spends money.
  #
  # Fork and Dependabot PRs can never reach this job — GitHub withholds secrets
  # from them, the label path requires a same-repo head, and the workflow uses
  # `pull_request`, never `pull_request_target` + contributor checkout (a "pwn
  # request").
  live-evals:
    needs: harness-smoke
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        contains(github.event.pull_request.labels.*.name, 'run-evals')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: evals/eve
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Eve's CLI requires Node.js >=24; setup-bun leaves the runner on Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install (frozen)
        run: bun install --frozen-lockfile
      - name: Materialize skills from canonical sources
        run: bun run prepare-skills
      - name: Run live behavioral evals
        env:
          # Subject model per provider (agent/agent.ts); the judge shares the
          # same key. `openai` reaches gpt-5.6-luna — a Codex model — directly
          # with a raw `sk-` key; the Vercel gateway is not involved.
          # `anthropic` reaches claude-sonnet-5, the other half of the audience.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Defaults to openai for the label path, which has no inputs.
          EVE_EVAL_PROVIDER: ${{ inputs.provider || 'openai' }}
          EVAL_FILTER: ${{ inputs.filter }}
        # Reaching this job means someone asked for it, so a missing key is a
        # misconfigured secret, never an expected condition. This used to exit 0
        # with a notice, which painted the lane green while running nothing — the
        # secret was in fact absent for this repo's first 22 stacked PRs and
        # every one of them reported a passing live-evals check.
        run: |
          case "${EVE_EVAL_PROVIDER}" in
            openai)    key="${OPENAI_API_KEY}";    secret_name="OPENAI_API_KEY" ;;
            anthropic) key="${ANTHROPIC_API_KEY}"; secret_name="ANTHROPIC_API_KEY" ;;
            *) echo "::error::EVE_EVAL_PROVIDER='${EVE_EVAL_PROVIDER}' is not openai or anthropic."; exit 1 ;;
          esac

          if [ -z "${key}" ]; then
            echo "::error::${secret_name} is not set, so no eval ran."
            echo "::error::Add the repository secret, or re-run selecting a provider whose key exists."
            exit 1
          fi

          # Unset the other provider's key so agent.ts cannot silently
          # auto-select it if EVE_EVAL_PROVIDER is ever dropped.
          if [ "${EVE_EVAL_PROVIDER}" = "anthropic" ]; then unset OPENAI_API_KEY; fi

          if [ -n "${EVAL_FILTER}" ]; then
            read -r -a eval_args <<< "${EVAL_FILTER}"
          else
            eval_args=(--tag live)
          fi
          bunx eve eval "${eval_args[@]}" --strict --junit .eve/junit.xml
      # `--strict` catches failing evals and an empty tag match, but not a run
      # that quietly executes fewer evals than the suite defines. Compare what
      # ran against what `eve eval --list` discovers. Skipped for a filtered
      # run, where running a subset is the whole point.
      - name: Assert live evals actually ran
        if: ${{ !inputs.filter }}
        run: bun scripts/assert-live-coverage.ts .eve/junit.xml
      - name: Upload eval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eve-eval-results
          path: |
            evals/eve/.eve/evals/
            evals/eve/.eve/junit.xml
          if-no-files-found: ignore
