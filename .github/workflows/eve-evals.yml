name: Eve skill evals

# Non-blocking behavioral-contract lane. This runs REAL model sessions against
# packaged SKILL.md dirs via Eve, so it complements — never replaces — the
# structural validate-skills.sh gate and the manual Claude/Codex dogfood.
# It is intentionally NOT a required check: Eve is public preview (pinned in
# evals/eve/package.json) and live evals need a model key.

on:
  pull_request:
    paths:
      - "**/skills/**/SKILL.md"
      - "evals/eve/**"
      - ".github/workflows/eve-evals.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Always runs, no secrets: proves the harness boots and grades a turn under
  # the deterministic mock model, and that the live eval files typecheck and
  # discover. This is the gate that catches harness rot on every PR.
  harness-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: evals/eve
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Eve's CLI requires Node.js >=24; setup-bun leaves the runner on Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install (frozen)
        run: bun install --frozen-lockfile
      - name: Materialize skills from canonical sources
        run: bun run prepare-skills
      - name: Typecheck eval files against Eve types
        run: bun run typecheck
      - name: Discover evals
        run: bun run list
      - name: Smoke eval (mock model, no secrets)
        run: bun run eval:smoke

  # Live behavioral evals against a real model. Secrets are withheld from fork
  # and Dependabot PRs by GitHub; skip cleanly there rather than failing, and
  # never use pull_request_target + contributor checkout (a "pwn request").
  live-evals:
    needs: harness-smoke
    if: >
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: evals/eve
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Eve's CLI requires Node.js >=24; setup-bun leaves the runner on Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install (frozen)
        run: bun install --frozen-lockfile
      - name: Materialize skills from canonical sources
        run: bun run prepare-skills
      - name: Run live behavioral evals
        env:
          # Subject model is `openai/gpt-5.6-luna` via the direct OpenAI provider
          # (agent/agent.ts); the judge shares this key. A raw OpenAI `sk-` key
          # reaches gpt-5.6-luna directly — the Vercel gateway is not involved.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Set this repository variable to `true` only for a fork that has no
          # key and accepts running without behavioral coverage.
          ALLOW_MISSING_EVAL_KEY: ${{ vars.ALLOW_MISSING_EVAL_KEY }}
        # This job already skips forks and Dependabot via the `if:` above, so a
        # missing key here is a misconfigured secret, not an expected condition.
        # It used to exit 0 and paint the lane green while testing nothing —
        # a revoked or expired key would have silently disabled every eval.
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            if [ "${ALLOW_MISSING_EVAL_KEY}" = "true" ]; then
              echo "::notice::OPENAI_API_KEY not set and ALLOW_MISSING_EVAL_KEY=true — skipping live evals."
              exit 0
            fi
            echo "::error::OPENAI_API_KEY is not set, so no eval ran. Secrets are"
            echo "::error::available to this job, so this is a misconfiguration."
            echo "::error::Set the secret, or set repository variable"
            echo "::error::ALLOW_MISSING_EVAL_KEY=true to accept an untested lane."
            exit 1
          fi
          bun run eval:live --junit .eve/junit.xml
      # `--strict` catches failing evals and an empty tag match, but not a run
      # that quietly executes fewer evals than the suite defines. Compare what
      # ran against what `eve eval --list` discovers.
      - name: Assert live evals actually ran
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALLOW_MISSING_EVAL_KEY: ${{ vars.ALLOW_MISSING_EVAL_KEY }}
        # Guard inline, not with `if:` — a step-level `env` is not in scope for
        # an `if:` expression, so `env.OPENAI_API_KEY != ''` would always be
        # false and silently skip this check.
        run: |
          if [ -z "${OPENAI_API_KEY}" ] && [ "${ALLOW_MISSING_EVAL_KEY}" = "true" ]; then
            echo "::notice::live evals were skipped by opt-out; nothing to assert."
            exit 0
          fi
          bun scripts/assert-live-coverage.ts .eve/junit.xml
      - name: Upload eval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eve-eval-results
          path: |
            evals/eve/.eve/evals/
            evals/eve/.eve/junit.xml
          if-no-files-found: ignore
