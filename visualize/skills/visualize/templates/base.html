<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualize - Reference Template</title>
<!--
  Reference template for the visualize skill (Explainer Arc edition).

  Style: the "HTML effectiveness" editorial gallery direction — ivory page,
  serif display type, clay accent, quiet cards, simple SVG illustrations,
  generous whitespace.

  Structure: the Explainer Arc, demonstrated with a small CDN explainer.

    MASTHEAD / GIST — whole idea in plain English + one anchor visual (≤5 elements)
    01 WALKTHROUGH  — step-through, one idea per step, captions state takeaways
    02 DEPTH        — real details, collapsed by default
    03 RECAP        — what to remember + glossary of introduced terms

  Adapt the structure and components; replace the demo content. For working
  surfaces (tuners, editors, review queues) drop the arc and keep the style.

  Stack:
  - Preact + htm via ESM CDN
  - Plain CSS custom properties
  - Mermaid.js only when a generated artifact needs a large diagram

  Keep generated pages self-contained. No build step.
-->
<style>
  :root {
    --ivory: #faf9f5;
    --paper: #ffffff;
    --ink: #141413;
    --clay: #d97757;
    --clay-dark: #b85c3e;
    --oat: #e3dacc;
    --olive: #788c5d;
    --mist: #f0eee6;
    --line: #d1cfc5;
    --muted: #87867f;
    --soft: #3d3d3a;
    --serif: ui-serif, Georgia, "Times New Roman", Times, serif;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ivory);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  ::selection { background: var(--oat); color: var(--ink); }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 72px 32px 120px;
  }

  /* ── Masthead / Gist ─────────────────────────────── */

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 18px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .eyebrow::before {
    content: "";
    width: 24px;
    height: 1.5px;
    background: var(--clay);
  }

  h1, h2, h3 {
    font-family: var(--serif);
    font-weight: 500;
    letter-spacing: -0.014em;
  }

  h1 {
    max-width: 18ch;
    margin: 0;
    font-size: clamp(38px, 5.2vw, 60px);
    line-height: 1.06;
  }

  h1 em { color: var(--clay); font-style: italic; }

  .gist {
    max-width: 640px;
    margin: 22px 0 6px;
    color: var(--ink);
    font-family: var(--serif);
    font-size: 21px;
    line-height: 1.5;
  }

  .audience {
    margin: 0 0 36px;
    color: var(--muted);
    font-size: 14px;
  }

  .anchor-figure {
    padding: 36px 28px 20px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: var(--paper);
  }

  .anchor-caption {
    margin: 22px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--mist);
    color: var(--soft);
    font-size: 14.5px;
    text-align: center;
  }

  /* ── Sections ────────────────────────────────────── */

  section { margin-top: 76px; }

  .section-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 12px;
  }

  .idx {
    width: 34px;
    flex: 0 0 34px;
    color: var(--clay);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
  }

  h2 {
    margin: 0;
    font-size: clamp(26px, 3.2vw, 38px);
    line-height: 1.12;
  }

  .section-intro {
    max-width: 700px;
    margin: 0 0 26px 50px;
    color: var(--soft);
    font-size: 15px;
  }

  /* ── Walkthrough (step-through) ──────────────────── */

  .walk {
    margin-left: 50px;
    overflow: hidden;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: var(--paper);
  }

  .walk-visual {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    padding: 32px 24px;
    border-bottom: 1.5px solid var(--line);
    background: var(--mist);
  }

  .walk-count {
    position: absolute;
    bottom: 10px;
    left: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--ivory);
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
  }

  .walk-body { padding: 26px 30px 8px; }

  .walk-body h3 {
    margin: 0 0 8px;
    font-size: 24px;
    line-height: 1.18;
  }

  .walk-body p {
    margin: 0;
    max-width: 640px;
    color: var(--soft);
    font-size: 15.5px;
  }

  .walk-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 30px 24px;
  }

  .dots { display: flex; gap: 7px; }

  .dot {
    width: 8px;
    height: 8px;
    padding: 0;
    border: none;
    border-radius: 999px;
    background: var(--line);
    cursor: pointer;
    transition: background 150ms ease, width 200ms ease;
  }

  .dot.active { width: 26px; background: var(--clay); }

  .btns { display: flex; gap: 8px; }

  .btn {
    padding: 8px 16px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    cursor: pointer;
    transition: border-color 150ms ease, background 150ms ease;
  }

  .btn:hover:not(:disabled) { border-color: var(--ink); }

  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--ivory); }

  .btn.primary:hover:not(:disabled) { background: var(--soft); }

  .btn:disabled { opacity: 0.35; cursor: default; }

  /* ── Step visuals (boxes and arrows) ─────────────── */

  .flow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }

  .node {
    padding: 10px 16px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--paper);
    font-size: 14px;
  }

  .node.accent {
    border: 2px solid var(--clay);
    background: #faf1ec;
    color: var(--clay-dark);
    font-weight: 600;
  }

  .node.ghost { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

  .flow-note { color: var(--clay-dark); font-size: 13.5px; font-weight: 600; }

  .arrow { color: var(--muted); font-family: var(--mono); font-size: 14px; }

  /* ── Depth (collapsed by default) ────────────────── */

  .depth-list { display: grid; gap: 12px; margin-left: 50px; }

  .depth {
    overflow: hidden;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
  }

  .depth-toggle {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    border: none;
    background: none;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
  }

  .depth-toggle:hover { background: var(--mist); }

  .chev { color: var(--muted); font-family: var(--mono); transition: transform 200ms ease; }

  .chev.open { transform: rotate(90deg); color: var(--clay); }

  .depth-body {
    padding: 4px 20px 18px;
    color: var(--soft);
    font-size: 14.5px;
  }

  .depth-body table { width: 100%; border-collapse: collapse; font-size: 14px; }

  .depth-body th {
    padding: 8px 12px 8px 0;
    border-bottom: 1.5px solid var(--line);
    text-align: left;
    font-weight: 600;
    color: var(--ink);
  }

  .depth-body td {
    padding: 8px 12px 8px 0;
    border-bottom: 1px solid var(--mist);
    vertical-align: top;
  }

  code {
    padding: 1px 5px;
    border-radius: 5px;
    background: var(--mist);
    font-family: var(--mono);
    font-size: 13px;
  }

  /* ── Recap + glossary ────────────────────────────── */

  .recap { display: grid; gap: 12px; margin-left: 50px; }

  .takeaway {
    display: flex;
    gap: 14px;
    align-items: baseline;
    padding: 16px 20px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    font-family: var(--serif);
    font-size: 17px;
  }

  .takeaway .idx { width: auto; flex: none; }

  .glossary {
    display: grid;
    gap: 10px;
    margin: 26px 0 0 50px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }

  .term { font-size: 14px; color: var(--soft); }

  .term b { color: var(--ink); }

  @media (max-width: 640px) {
    .wrap { padding: 48px 20px 90px; }
    .section-head { flex-wrap: wrap; }
    .section-intro, .walk, .depth-list, .recap, .glossary { margin-left: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10';
import { useState } from 'https://esm.sh/preact@10/hooks';
import htm from 'https://esm.sh/htm@3';

const html = htm.bind(h);

// ─── Demo content: a CDN explainer ─────────────────────────────────
// Audience: someone who has heard "CDN" but never needed one.
// Replace everything in this block for a real explainer.

const GIST = {
  eyebrow: 'Explainer',
  audience: 'for anyone who has heard "CDN" but never needed one',
};

// One idea per step. Captions state the TAKEAWAY, not a label.
const STEPS = [
  {
    title: 'Without a CDN, distance is the delay',
    body: 'A visitor in Tokyo asking a server in Virginia waits for every request to cross the planet and come back. No amount of server power fixes geography.',
    visual: html`
      <div class="flow">
        <span class="node">Tokyo</span>
        <span class="flow-note">~11,000 km, every single request</span>
        <span class="node">Virginia</span>
      </div>`,
  },
  {
    title: 'The first visitor fills the local shelf',
    body: 'The first Tokyo request still travels to Virginia — but on the way back, the nearby CDN location keeps a copy. This is called caching: keeping a copy close so the next person gets it instantly.',
    visual: html`
      <div class="flow">
        <span class="node">Tokyo</span>
        <span class="arrow">-&gt;</span>
        <span class="node accent">copy saved here</span>
        <span class="arrow">-&gt;</span>
        <span class="node">Virginia</span>
      </div>`,
  },
  {
    title: 'Every later visitor skips the ocean',
    body: 'The second Tokyo visitor is served from the local copy in milliseconds. Your Virginia server never even hears about it — which also means it can handle far more visitors overall.',
    visual: html`
      <div class="flow">
        <span class="node">Tokyo</span>
        <span class="flow-note">served locally ✓</span>
        <span class="node accent">local copy</span>
        <span class="node ghost">Virginia</span>
      </div>`,
  },
];

// Real details, collapsed by default. A reader who stops before this
// still has a correct mental model.
const DEPTH = [
  {
    summary: 'What actually gets cached (and what can’t be)',
    body: html`
      <p>Static files — images, CSS, JavaScript, fonts, video — cache beautifully. Personalized content (your shopping cart, your inbox) can’t be shared between users, so it usually passes through to the origin server.</p>
      <table>
        <thead><tr><th>Content</th><th>Cacheable?</th></tr></thead>
        <tbody>
          <tr><td>Images, CSS, JS, fonts</td><td>Yes — hours to months</td></tr>
          <tr><td>HTML pages</td><td>Sometimes — seconds to minutes</td></tr>
          <tr><td>Logged-in / personalized data</td><td>No — passes through</td></tr>
        </tbody>
      </table>`,
  },
  {
    summary: 'The hard problem: stale copies',
    body: html`
      <p>Copies age. If you update your homepage, Tokyo’s shelf still holds the old one until it expires (a timer set by a <code>Cache-Control</code> header) or you evict it early (called invalidation). Most real-world CDN bugs are stale-copy bugs — this is the part worth reading more about.</p>`,
  },
];

const RECAP = [
  'A CDN beats distance by keeping copies of your site near your visitors.',
  'Only the first nearby visitor pays the long trip — everyone after gets the local copy.',
  'The hard part is freshness: knowing when a local copy is out of date.',
];

const GLOSSARY = [
  { term: 'CDN', def: 'Content delivery network — the service that runs the citywide copy shelves.' },
  { term: 'caching', def: 'Keeping a copy close so the next request is served instantly.' },
  { term: 'origin', def: 'Your real server — the single source the copies come from.' },
  { term: 'invalidation', def: 'Deleting a cached copy early because the original changed.' },
];

// Anchor visual: ≤5 elements, ONE clay accent (the copy near the user).
function AnchorVisual() {
  return html`
    <div class="flow">
      <span class="node">your server<br /><small style="color: var(--muted)">(one place)</small></span>
      <span class="arrow">-&gt;</span>
      <span class="node accent">copies in many cities</span>
      <span class="arrow">-&gt;</span>
      <span class="node">your visitor<br /><small style="color: var(--muted)">(anywhere)</small></span>
    </div>`;
}

// ─── Arc components (keep these; restyle only if needed) ───────────

function SectionHead({ n, title }) {
  return html`
    <div class="section-head">
      <span class="idx">${n}</span>
      <h2>${title}</h2>
    </div>`;
}

function Walkthrough({ steps }) {
  const [step, setStep] = useState(0);
  const current = steps[step];
  const pad = n => String(n).padStart(2, '0');
  const go = i => setStep(Math.max(0, Math.min(i, steps.length - 1)));

  return html`
    <div class="walk">
      <div class="walk-visual">
        <div key=${step}>${current.visual}</div>
        <span class="walk-count">${pad(step + 1)} / ${pad(steps.length)}</span>
      </div>
      <div class="walk-body" key=${'t' + step}>
        <h3>${current.title}</h3>
        <p>${current.body}</p>
      </div>
      <div class="walk-controls">
        <div class="dots">
          ${steps.map((_, i) => html`
            <button key=${i} class=${i === step ? 'dot active' : 'dot'} onClick=${() => go(i)} aria-label=${'Step ' + (i + 1)}></button>
          `)}
        </div>
        <div class="btns">
          <button class="btn" disabled=${step === 0} onClick=${() => go(step - 1)} aria-label="Previous">Back</button>
          <button class="btn primary" disabled=${step === steps.length - 1} onClick=${() => go(step + 1)} aria-label="Next">Next</button>
        </div>
      </div>
    </div>`;
}

function Depth({ summary, children }) {
  const [open, setOpen] = useState(false);
  return html`
    <div class="depth">
      <button class="depth-toggle" onClick=${() => setOpen(!open)}>
        <span>${summary}</span>
        <span class=${open ? 'chev open' : 'chev'}>&gt;</span>
      </button>
      ${open && html`<div class="depth-body">${children}</div>`}
    </div>`;
}

// ─── Page ──────────────────────────────────────────────────────────

function App() {
  return html`
    <main class="wrap">

      <!-- GIST: first screen = whole idea, plain words, one anchor visual -->
      <header>
        <p class="eyebrow">${GIST.eyebrow}</p>
        <h1>What a CDN <em>actually does</em></h1>
        <p class="gist">
          Your website lives on one computer, but your visitors are everywhere.
          A CDN (content delivery network) keeps copies of your site in cities
          near your visitors, so nobody waits for data to cross an ocean.
        </p>
        <p class="audience">${GIST.audience}</p>
        <figure class="anchor-figure" style="margin: 0">
          <${AnchorVisual} />
          <figcaption class="anchor-caption">
            The middle box is the whole trick: copies stored near the people asking.
          </figcaption>
        </figure>
      </header>

      <!-- 01 WALKTHROUGH: one idea per step -->
      <section>
        <${SectionHead} n="01" title="How it works, one step at a time" />
        <div class="section-intro">Step through the mechanism — each step adds exactly one idea.</div>
        <${Walkthrough} steps=${STEPS} />
      </section>

      <!-- 02 DEPTH: collapsed by default -->
      <section>
        <${SectionHead} n="02" title="Details, when you want them" />
        <div class="depth-list">
          ${DEPTH.map((d, i) => html`<${Depth} key=${i} summary=${d.summary}>${d.body}<//>`)}
        </div>
      </section>

      <!-- 03 RECAP: what to remember + glossary -->
      <section>
        <${SectionHead} n="03" title="What to remember" />
        <div class="recap">
          ${RECAP.map((p, i) => html`
            <div class="takeaway" key=${i}><span class="idx">${i + 1}</span><span>${p}</span></div>
          `)}
        </div>
        <div class="glossary">
          ${GLOSSARY.map(g => html`
            <div class="term" key=${g.term}><b>${g.term}</b> — ${g.def}</div>
          `)}
        </div>
      </section>
    </main>`;
}

// Keyboard navigation for the walkthrough
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (e.key === 'ArrowRight') document.querySelector('[aria-label="Next"]')?.click();
  if (e.key === 'ArrowLeft') document.querySelector('[aria-label="Previous"]')?.click();
});

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
