<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walkthrough — Reference Template</title>
<!--
  Reference template for the visualize skill.
  Demonstrates the Threaded design system with a step-through walkthrough.
  Claude reads this before generating, then adapts the structure for the
  specific visualization (Mermaid diagram, table, timeline, etc.).

  Tech stack (no build step):
  - Preact + htm via ESM CDN
  - Tailwind CSS CDN with inline config
  - Google Fonts: Merriweather + Inter
  - Mermaid.js CDN (add only when diagrams are needed)

  Key patterns:
  - Threaded typography: serif headings, sans body, 1.125rem/1.8 reading rhythm
  - Visual area: bg-slate-50 rounded-2xl border border-slate-200 p-10
  - Spacious layout: max-w-2xl mx-auto px-6 py-16
  - Step-through walkthrough with Preact components
  - Subtle animations: fadeIn and fadeInSoft
  - Light default with dark mode toggle (class-based, persisted to localStorage)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<script>
  // Theme: light default, persist choice to localStorage
  (function() {
    var stored = localStorage.getItem('theme');
    if (stored === 'dark') document.documentElement.classList.add('dark');
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        serif: ['Merriweather', 'Georgia', 'serif'],
        sans: ['Inter', 'system-ui', 'sans-serif'],
      },
      colors: {
        accent: { DEFAULT: '#b45309', light: '#fef3c7' },
      },
      animation: {
        'fade-in': 'fadeIn 0.4s ease forwards',
        'fade-in-soft': 'fadeInSoft 0.6s ease forwards',
      },
      keyframes: {
        fadeIn: {
          from: { opacity: '0', transform: 'translateY(4px)' },
          to: { opacity: '1', transform: 'translateY(0)' },
        },
        fadeInSoft: {
          from: { opacity: '0' },
          to: { opacity: '1' },
        },
      },
    },
  },
}
</script>
<style>
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  .dark ::-webkit-scrollbar-thumb { background: #334155; }

  /* Selection */
  ::selection { background: #fef3c7; color: #78350f; }
  .dark ::selection { background: #78350f; color: #fef3c7; }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">

<div id="app"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10';
import { useState } from 'https://esm.sh/preact@10/hooks';
import htm from 'https://esm.sh/htm@3';

const html = htm.bind(h);

// ─── Data ──────────────────────────────────────────────
const STEPS = [
  {
    title: 'Ingestion',
    body: 'Raw payloads arrive and pass schema validation before entering the pipeline.',
    visual: html`
      <div class="flex flex-col items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-500">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22v-10"/></svg>
        </div>
        <span class="font-mono text-[10px] uppercase tracking-widest text-slate-400">Receiving</span>
      </div>`,
  },
  {
    title: 'Transformation',
    body: 'Data is normalized, sensitive fields are hashed, and timestamps convert to UTC.',
    visual: html`
      <div class="w-36">
        <div class="h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden mb-2">
          <div class="h-full w-2/3 bg-amber-600 rounded-full"></div>
        </div>
        <div class="flex justify-between font-mono text-[10px] text-slate-400">
          <span>0x8F…A2</span><span>Processing</span>
        </div>
      </div>`,
  },
  {
    title: 'Distribution',
    body: 'Finalized objects push to the edge network for low-latency access worldwide.',
    visual: html`
      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium">
        <svg class="text-emerald-600" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        Synced
      </div>`,
  },
];

// ─── Components ────────────────────────────────────────

function StepDots({ current, total, onSelect }) {
  return html`
    <div class="flex gap-1.5">
      ${Array.from({ length: total }, (_, i) => html`
        <button
          key=${i}
          onClick=${() => onSelect(i)}
          aria-label=${`Step ${i + 1}`}
          class="h-6 flex items-center justify-center"
        >
          <span class=${`block h-1.5 rounded-full transition-all duration-300 ${
            i === current
              ? 'w-6 bg-amber-600'
              : 'w-1.5 bg-slate-300 dark:bg-slate-600'
          }`} />
        </button>
      `)}
    </div>`;
}

function StepControls({ current, total, onPrev, onNext }) {
  return html`
    <div class="flex gap-2">
      <button
        onClick=${onPrev}
        disabled=${current === 0}
        class="w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-25 transition-colors"
        aria-label="Previous"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button
        onClick=${onNext}
        disabled=${current === total - 1}
        class="h-8 px-3 rounded-lg bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-semibold flex items-center gap-1.5 disabled:opacity-25 transition-colors"
        aria-label="Next"
      >
        Next
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>`;
}

function ThemeToggle() {
  const [dark, setDark] = useState(document.documentElement.classList.contains('dark'));
  const toggle = () => {
    const next = !dark;
    document.documentElement.classList.toggle('dark', next);
    localStorage.setItem('theme', next ? 'dark' : 'light');
    setDark(next);
  };
  return html`
    <button onClick=${toggle} aria-label=${dark ? 'Switch to light mode' : 'Switch to dark mode'}
      class="w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
      ${dark
        ? html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`
        : html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`
      }
    </button>`;
}

function App() {
  const [step, setStep] = useState(0);
  const current = STEPS[step];
  const pad = n => String(n).padStart(2, '0');

  const go = i => setStep(Math.max(0, Math.min(i, STEPS.length - 1)));

  return html`
    <div class="max-w-2xl mx-auto px-6 py-16">
      <!-- Header -->
      <div class="flex items-center justify-between mb-6">
        <p class="font-mono text-xs uppercase tracking-widest text-slate-400 dark:text-slate-500">
          Docs <span class="mx-1.5 text-slate-300 dark:text-slate-600">/</span> Workflow
        </p>
        <${ThemeToggle} />
      </div>

      <!-- Card -->
      <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">

        <!-- Visual area -->
        <div class="relative bg-slate-50 dark:bg-slate-800/50 aspect-video flex items-center justify-center border-b border-slate-200 dark:border-slate-800">
          <div key=${step} class="animate-fade-in-soft">
            ${current.visual}
          </div>
          <span class="absolute bottom-3 left-3 font-mono text-[10px] text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded">
            ${pad(step + 1)} / ${pad(STEPS.length)}
          </span>
        </div>

        <!-- Text area -->
        <div class="p-8" key=${step}>
          <h2 class="font-serif text-2xl font-bold text-slate-900 dark:text-slate-100 mb-2 animate-fade-in">
            ${current.title}
          </h2>
          <p class="font-serif text-lg leading-relaxed text-slate-600 dark:text-slate-400 animate-fade-in" style="animation-delay: 80ms; opacity: 0;">
            ${current.body}
          </p>
        </div>

        <!-- Controls -->
        <div class="flex items-center justify-between px-8 pb-8">
          <${StepDots} current=${step} total=${STEPS.length} onSelect=${go} />
          <${StepControls} current=${step} total=${STEPS.length} onPrev=${() => go(step - 1)} onNext=${() => go(step + 1)} />
        </div>
      </div>
    </div>`;
}

// ─── Keyboard navigation ───────────────────────────────
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (e.key === 'ArrowRight') document.querySelector('[aria-label="Next"]')?.click();
  if (e.key === 'ArrowLeft') document.querySelector('[aria-label="Previous"]')?.click();
});

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
