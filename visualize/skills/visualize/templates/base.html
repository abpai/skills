<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualize - Reference Template</title>
<!--
  Reference template for the visualize skill.

  The style follows the "HTML effectiveness" editorial gallery direction:
  ivory page, serif display type, clay accent, quiet cards, simple SVG
  illustrations, and generous whitespace. Read this before generating, then
  adapt the sections, cards, diagrams, tables, and interactions to the user's
  requested artifact.

  Stack:
  - Preact + htm via ESM CDN
  - Plain CSS custom properties
  - Mermaid.js only when a generated artifact needs a diagram

  Keep generated pages self-contained. No build step.
-->
<style>
  :root {
    --ivory: #faf9f5;
    --paper: #ffffff;
    --ink: #141413;
    --clay: #d97757;
    --clay-dark: #b85c3e;
    --oat: #e3dacc;
    --olive: #788c5d;
    --mist: #f0eee6;
    --line: #d1cfc5;
    --muted: #87867f;
    --soft: #3d3d3a;
    --serif: ui-serif, Georgia, "Times New Roman", Times, serif;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--ivory);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
  }

  ::selection {
    background: var(--oat);
    color: var(--ink);
  }

  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 72px 32px 120px;
  }

  .masthead {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 48px;
    align-items: end;
    padding-bottom: 52px;
    border-bottom: 1.5px solid var(--line);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 18px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .eyebrow::before {
    content: "";
    width: 24px;
    height: 1.5px;
    background: var(--clay);
  }

  h1,
  h2,
  h3 {
    font-family: var(--serif);
    font-weight: 500;
    letter-spacing: -0.014em;
  }

  h1 {
    max-width: 16ch;
    margin: 0;
    font-size: clamp(40px, 5.6vw, 68px);
    line-height: 1.05;
  }

  h1 em {
    color: var(--clay);
    font-style: italic;
  }

  .intro {
    max-width: 650px;
    margin: 24px 0 0;
    color: var(--soft);
    font-size: 16.5px;
  }

  .hero-figure {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    align-items: end;
  }

  .pane {
    position: relative;
    display: flex;
    min-height: 220px;
    flex-direction: column;
    gap: 8px;
    padding: 16px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
  }

  .pane.plain {
    transform: rotate(-2deg) translateY(8px);
    background: var(--mist);
  }

  .pane.rich {
    transform: rotate(1deg);
    border-color: var(--ink);
    box-shadow: 0 14px 34px rgba(20, 20, 19, 0.10);
  }

  .tag {
    position: absolute;
    top: -11px;
    left: 12px;
    padding: 2px 8px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: var(--ivory);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
  }

  .rich .tag {
    border-color: var(--ink);
    color: var(--ink);
  }

  .line {
    height: 7px;
    border-radius: 999px;
    background: var(--line);
  }

  .rich .line {
    background: var(--mist);
  }

  .w90 { width: 90%; }
  .w75 { width: 75%; }
  .w60 { width: 60%; }
  .w50 { width: 50%; }

  .visual-block {
    position: relative;
    flex: 1;
    border-radius: 8px;
    background: var(--oat);
    overflow: hidden;
  }

  .visual-block::after {
    content: "";
    position: absolute;
    inset: 24% 22%;
    border: 2px solid var(--clay);
    border-radius: 999px;
  }

  .bars {
    display: flex;
    align-items: end;
    gap: 6px;
  }

  .bar {
    flex: 1;
    border-radius: 4px 4px 0 0;
  }

  .b1 { height: 20px; background: var(--olive); }
  .b2 { height: 34px; background: var(--clay); }
  .b3 { height: 24px; background: var(--oat); }
  .b4 { height: 38px; background: var(--ink); }

  section {
    margin-top: 72px;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 12px;
  }

  .idx {
    width: 34px;
    flex: 0 0 34px;
    color: var(--clay);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
  }

  h2 {
    margin: 0;
    font-size: clamp(28px, 3.4vw, 42px);
    line-height: 1.1;
  }

  .count {
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--mist);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
  }

  .section-intro {
    max-width: 760px;
    margin: 0 0 28px 50px;
    color: var(--soft);
    font-size: 15px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    margin-left: 50px;
  }

  .card {
    display: flex;
    min-height: 430px;
    flex-direction: column;
    overflow: hidden;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: var(--paper);
    color: inherit;
    text-decoration: none;
    transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: var(--ink);
    box-shadow: 0 12px 32px rgba(20, 20, 19, 0.10);
  }

  .thumb {
    display: flex;
    height: 154px;
    align-items: center;
    justify-content: center;
    border-bottom: 1.5px solid var(--line);
    background: var(--mist);
    padding: 18px;
    transition: background 150ms ease;
  }

  .card:hover .thumb {
    background: var(--oat);
  }

  .thumb svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .stroke {
    fill: none;
    stroke: var(--muted);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .white {
    fill: var(--paper);
    stroke: var(--muted);
    stroke-width: 3;
  }

  .fill-muted { fill: var(--line); }
  .fill-clay { fill: var(--clay); }
  .fill-olive { fill: var(--olive); }
  .fill-oat { fill: var(--oat); }
  .fill-ink { fill: var(--ink); }
  .clay-line {
    fill: none;
    stroke: var(--clay);
    stroke-width: 3;
    stroke-linecap: round;
  }

  .card-body {
    display: flex;
    flex: 1;
    flex-direction: column;
    padding: 22px 22px 18px;
  }

  h3 {
    margin: 0 0 10px;
    font-size: 25px;
    line-height: 1.16;
  }

  .desc {
    flex: 1;
    margin: 0 0 22px;
    color: var(--soft);
    font-size: 15px;
  }

  .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--mist);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
  }

  .arrow {
    color: var(--line);
    transition: transform 150ms ease, color 150ms ease;
  }

  .card:hover .meta {
    color: var(--clay-dark);
  }

  .card:hover .arrow {
    transform: translateX(3px);
    color: var(--clay);
  }

  @media (max-width: 900px) {
    .masthead {
      grid-template-columns: 1fr;
    }

    .hero-figure {
      max-width: 420px;
    }

    .grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 640px) {
    .wrap {
      padding: 48px 20px 90px;
    }

    .section-head {
      flex-wrap: wrap;
    }

    .section-intro,
    .grid {
      margin-left: 0;
    }

    .card {
      min-height: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10';
import htm from 'https://esm.sh/htm@3';

const html = htm.bind(h);

const cards = [
  {
    title: 'Annotated flow',
    body: 'A hot path rendered as boxes and arrows, with the risky transition called out in clay.',
    file: '01-annotated-flow.html',
    kind: 'flow',
  },
  {
    title: 'Comparison grid',
    body: 'Three options side by side so the tradeoffs are visible without holding them in your head.',
    file: '02-comparison-grid.html',
    kind: 'grid',
  },
  {
    title: 'Implementation plan',
    body: 'Milestones, data movement, risky files, and validation evidence arranged for handoff.',
    file: '03-implementation-plan.html',
    kind: 'plan',
  },
];

function FlowThumb() {
  return html`
    <svg viewBox="0 0 120 80" role="img" aria-label="Flow thumbnail">
      <rect class="white" x="8" y="14" width="30" height="24" rx="5" />
      <rect class="fill-oat" x="46" y="14" width="30" height="24" rx="5" />
      <rect class="white" x="84" y="14" width="30" height="24" rx="5" />
      <path class="stroke" d="M38 26h8M76 26h8" />
      <rect class="fill-clay" x="46" y="50" width="30" height="16" rx="4" />
      <path class="clay-line" d="M61 38v12" />
    </svg>
  `;
}

function GridThumb() {
  return html`
    <svg viewBox="0 0 120 80" role="img" aria-label="Grid thumbnail">
      <rect class="white" x="8" y="10" width="30" height="56" rx="5" />
      <rect class="white" x="45" y="10" width="30" height="56" rx="5" />
      <rect class="fill-oat" x="82" y="10" width="30" height="56" rx="5" />
      <path class="stroke" d="M15 26h16M15 37h12M52 26h16M52 37h12" />
      <path class="clay-line" d="M89 26h16M89 37h12" />
      <circle class="fill-clay" cx="97" cy="53" r="6" />
    </svg>
  `;
}

function PlanThumb() {
  return html`
    <svg viewBox="0 0 120 80" role="img" aria-label="Plan thumbnail">
      <path class="stroke" d="M18 12v56" />
      <circle class="fill-clay" cx="18" cy="16" r="6" />
      <circle class="fill-olive" cx="18" cy="40" r="6" />
      <circle class="fill-muted" cx="18" cy="64" r="6" />
      <path class="stroke" d="M34 17h44M34 40h34M34 64h42" />
      <rect class="fill-oat" x="84" y="12" width="28" height="22" rx="5" />
      <rect class="white" x="84" y="46" width="28" height="22" rx="5" />
      <path class="clay-line" d="M91 57h14" />
    </svg>
  `;
}

function Thumb({ kind }) {
  if (kind === 'flow') return html`<${FlowThumb} />`;
  if (kind === 'grid') return html`<${GridThumb} />`;
  return html`<${PlanThumb} />`;
}

function Card({ item }) {
  return html`
    <article class="card">
      <div class="thumb"><${Thumb} kind=${item.kind} /></div>
      <div class="card-body">
        <h3>${item.title}</h3>
        <p class="desc">${item.body}</p>
        <div class="meta">
          <span>${item.file}</span>
          <span class="arrow">-&gt;</span>
        </div>
      </div>
    </article>
  `;
}

function App() {
  return html`
    <main class="wrap">
      <header class="masthead">
        <div>
          <p class="eyebrow">HTML artifact</p>
          <h1>The useful shape of <em>visual explanation</em></h1>
          <p class="intro">
            Use HTML when the user needs to compare, navigate, tune, or share the result.
            Start with one strong visual surface, then add only the prose needed to make
            the picture trustworthy.
          </p>
        </div>

        <div class="hero-figure" aria-hidden="true">
          <div class="pane plain">
            <span class="tag">linear</span>
            <span class="line w90"></span>
            <span class="line w75"></span>
            <span class="line w60"></span>
            <span class="line w90"></span>
            <span class="line w50"></span>
            <span class="line w75"></span>
          </div>
          <div class="pane rich">
            <span class="tag">spatial</span>
            <span class="line w60"></span>
            <span class="visual-block"></span>
            <span class="bars">
              <span class="bar b1"></span>
              <span class="bar b2"></span>
              <span class="bar b3"></span>
              <span class="bar b4"></span>
            </span>
            <span class="line w75"></span>
          </div>
        </div>
      </header>

      <section>
        <div class="section-head">
          <span class="idx">01</span>
          <h2>Exploration & Planning</h2>
          <span class="count">${cards.length} patterns</span>
        </div>
        <p class="section-intro">
          Replace long sequential documents with a page the reader can scan once.
          Use cards, diagrams, tables, and small interactions to make structure obvious.
        </p>
        <div class="grid">
          ${cards.map(item => html`<${Card} key=${item.file} item=${item} />`)}
        </div>
      </section>
    </main>
  `;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
